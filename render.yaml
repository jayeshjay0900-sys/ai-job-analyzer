services:

  - type: web

    name: ai-job-analyzer

    runtime: python

    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

      - key: GROQ_URL
        value: https://api.groq.com/openai/v1/chat/completions